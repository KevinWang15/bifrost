services:
  providers:
    image: python:3.12-slim
    command: ["python", "/tests/providers.py"]
    volumes:
      - .:/tests:ro
  gateway:
    image: golang:1.27.0-bookworm
    command: ["/tests/bifrost", "-app-dir", "/data", "-host", "0.0.0.0", "-port", "8080", "-log-level", "warn"]
    volumes:
      - ../../tmp/reasoning-cache/bifrost:/tests/bifrost:ro
      - ./config.json:/data/config.json:ro
      - ../../transports/config.schema.json:/schema/config.schema.json:ro
    working_dir: /schema
    depends_on:
      - providers
  verify:
    image: python:3.12-slim
    command: ["python", "/tests/verify.py"]
    volumes:
      - .:/tests:ro
    depends_on:
      - gateway
